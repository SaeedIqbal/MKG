# Baseline Models Configurations (for comparative evaluation)
baselines:
  hlml_snn:
    hidden_features: 256
    tau_m: 20.0
    v_th: 1.0
    rate_based_hebbian: true  # Flawed rate approximation: Delta W ~ mean(S_pre) * mean(S_post)
    
  snn_lora:
    rank: 8                   # Standard LoRA rank
    requires_bptt: true       # Requires global Backpropagation Through Time
    
  alade_snn:
    expansion_per_task: 50    # Physical neurons added per task (O(N) memory bloat)
    
  cls_er:
    buffer_size: 500          # Episodic memory buffer size
    lambda_replay: 0.5        # Replay loss weight